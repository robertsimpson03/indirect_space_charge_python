[build-sysstem]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "indirect_space_charge"
version = "0.1.0"
description = "My Python package"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "xtrack",
    "xtobjects",
]

[tool.setuptools.packages.find]
where = ["."]
